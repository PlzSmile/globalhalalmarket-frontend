<a class="skip-link" href="#app-main">Skip to content</a>

<mat-sidenav-container class="shell">
  <mat-sidenav #drawer class="shell__sidenav" [mode]="isLarge() ? 'side' : 'over'" [opened]="isLarge()"
               [fixedInViewport]="!isLarge()" aria-label="App navigation">
    <div class="shell__brand">
      <hs-logo />
      @if (!isLarge()) {
        <button mat-icon-button type="button" (click)="drawer.close()" aria-label="Close menu">
          <mat-icon svgIcon="close" />
        </button>
      }
    </div>

    <mat-nav-list class="shell__nav">
      @for (item of nav; track item.path) {
        <a mat-list-item [routerLink]="item.path" routerLinkActive #rla="routerLinkActive"
           [activated]="rla.isActive" [attr.aria-current]="rla.isActive ? 'page' : null"
           (click)="isLarge() || drawer.close()">
          <mat-icon matListItemIcon [svgIcon]="item.icon" />
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>

    <mat-nav-list class="shell__footer">
      <a mat-list-item href="/">
        <mat-icon matListItemIcon svgIcon="external" />
        <span matListItemTitle>Public checker</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="shell__main">
    <mat-toolbar class="shell__toolbar">
      @if (!isLarge()) {
        <button mat-icon-button type="button" (click)="drawer.open()" aria-label="Open menu" [attr.aria-expanded]="drawer.opened">
          <mat-icon svgIcon="menu" />
        </button>
      }
      <span class="shell__company">{{ auth.user()?.company?.name }}</span>
      <button mat-icon-button type="button" (click)="theme.toggle()"
              [matTooltip]="theme.theme() === 'dark' ? 'Light theme' : 'Dark theme'"
              [attr.aria-pressed]="theme.theme() === 'dark'"
              [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'">
        <mat-icon [svgIcon]="theme.theme() === 'dark' ? 'sun' : 'moon'" />
      </button>
      <button mat-icon-button type="button" [matMenuTriggerFor]="userMenu" aria-label="Account menu">
        <mat-icon svgIcon="user" />
      </button>
      <mat-menu #userMenu="matMenu" xPosition="before">
        <div class="shell__who" aria-hidden="true">
          <strong>{{ auth.user()?.name }}</strong>
          <span>{{ auth.user()?.email }}</span>
        </div>
        <a mat-menu-item routerLink="/settings"><mat-icon svgIcon="settings" /> Settings</a>
        <a mat-menu-item routerLink="/settings" [queryParams]="{ tab: 'team' }"><mat-icon svgIcon="users" /> Team</a>
        <button mat-menu-item type="button" (click)="logout()"><mat-icon svgIcon="logout" /> Log out</button>
      </mat-menu>
    </mat-toolbar>

    <main class="shell__content" id="app-main" tabindex="-1">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
